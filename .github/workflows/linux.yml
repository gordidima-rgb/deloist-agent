name: linux

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Ручной запуск: собрать и опубликовать образ стенда с этой ветки (тег образа — из поля `tag`).
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег образа в ghcr.io/gordidima-rgb/deloist-server"
        default: "stand"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: stable

jobs:
  server:
    name: server shape (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - name: Build (server only, no GTK/WebKit)
        run: cargo build --no-default-features
      - name: Server shape must not pull GTK, WebKit or window crates
        run: |
          if cargo tree --no-default-features --edges normal | grep -E '(^|[ │├└─]+)(gtk|webkit2gtk|wry|tao|tray-icon) v'; then
            echo "window crates leaked into the server shape"; exit 1
          fi
      # drivers / safety / surface / user_chrome suites need sh-based fake programs
      # and run on Windows only until stage 2-3.
      - name: Compile every test target
        run: cargo test --no-default-features --no-run
      - name: Test (unit)
        run: cargo test --no-default-features --bin deloist --no-fail-fast -- --test-threads 2
      - name: Test (core)
        run: cargo test --no-default-features --test core --no-fail-fast -- --test-threads 2
      - name: Test (cloud and Linux secrets guarantees)
        run: cargo test --no-default-features --test safety -- --test-threads 2 the_secrets_master_key_file_is_closed_like_any_key the_master_key_is_never_in_a_team_export cloud_mode_keeps_the_master_key_out_of_command_environment cloud_mode_refuses_to_start_without_a_valid_key cloud_mode_process_memory_and_environ_do_not_reveal_the_key a_secrets_key_without_cloud_mode_is_refused cloud_mode_has_no_run_command_and_refuses_a_forced_call cloud_mode_file_tools_work_only_inside_the_bots_own_folder cloud_mode_refuses_cli_and_acp_bots cloud_mode_refuses_stdio_mcp_and_connectors_but_takes_http cloud_mode_closes_every_route_that_starts_a_process_or_touches_the_desktop cloud_flag_without_server_is_a_startup_error

  desktop:
    name: desktop shape (build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: Build (desktop, default features)
        run: cargo build

  package:
    name: package release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Архивы прикладываются к выпуску этого тега (его создаёт release.ps1 до того, как тег приходит сюда).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build release (server)
        run: cargo build --release --no-default-features --bin deloist
      - name: Package server
        run: |
          mkdir -p dist/deloist-server
          cp target/release/deloist dist/deloist-server/deloist
          tar -C dist -czf dist/deloist-server-linux-x86_64.tar.gz deloist-server
      - name: Build release (desktop)
        run: cargo build --release --bin deloist
      - name: Package desktop
        run: |
          mkdir -p dist/Deloist
          cp target/release/deloist dist/Deloist/deloist
          tar -C dist -czf dist/Deloist-linux-x86_64.tar.gz Deloist
      - uses: actions/upload-artifact@v4
        with:
          name: deloist-linux-x86_64
          path: |
            dist/Deloist-linux-x86_64.tar.gz
            dist/deloist-server-linux-x86_64.tar.gz
      # Раньше архивы жили только артефактом прогона (90 дней) и в выпуск не попадали.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum Deloist-linux-x86_64.tar.gz deloist-server-linux-x86_64.tar.gz > SHA256SUMS-linux.txt
          gh release upload "$GITHUB_REF_NAME" Deloist-linux-x86_64.tar.gz deloist-server-linux-x86_64.tar.gz SHA256SUMS-linux.txt --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    name: docker image (not pushed)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t deloist-server:ci .

  # Образ облачного сервера в GitHub Packages (публичный): push в main -> :main, ручной запуск -> :<tag>.
  # Стенд на сервере сам подтягивает новый образ (таймер раз в 10 минут). Секретов нет: только GITHUB_TOKEN.
  image:
    name: publish server image
    # feat/stand — до того, как этот файл попадёт в main (ручной запуск GitHub видит только из main).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/stand' || startsWith(github.ref, 'refs/tags/v')))
    needs: [server]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: tag
        run: |
          # Выпуск v0.4.9 -> образ :0.4.9 и :latest; main -> :main.
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then t="${{ inputs.tag }}";
          elif [ "${{ github.ref }}" = "refs/heads/feat/stand" ]; then t="stand";
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then t="${GITHUB_REF_NAME#v}"; extra="ghcr.io/gordidima-rgb/deloist-server:latest";
          else t="main"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gordidima-rgb/deloist-server:${{ steps.tag.outputs.tag }}
            ghcr.io/gordidima-rgb/deloist-server:sha-${{ github.sha }}
            ${{ steps.tag.outputs.extra }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
