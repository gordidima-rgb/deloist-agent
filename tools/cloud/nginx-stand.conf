# nginx: stand.deloist.ru -> контейнер стенда на 127.0.0.1:18901. Сертификат добавит certbot --nginx.
# Пропускаем только то, что нужно окну программы. Заголовок Authorization из браузера не передаём:
# ключ программы работает только изнутри контейнера.
map $http_upgrade $deloist_stand_conn { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name stand.deloist.ru;

    client_max_body_size 50m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/hooks/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:18901;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $deloist_stand_conn;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Пропуск ?t= в журнал не пишем.
        access_log off;
    }
}
