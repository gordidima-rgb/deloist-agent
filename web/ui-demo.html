<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deloist UI: kit</title>
    <link rel="icon" href="data:," />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/kit.css" />
    <link rel="stylesheet" href="/ui/kit.css" />
    <style>
      /* Только для разработчика: в релизной сборке страницы нет (server.rs, cfg(debug_assertions)). */
      body {
        margin: 0;
        padding: 24px;
        background: var(--k-canvas);
        color: var(--k-text);
        font: 400 15px/1.5 var(--k-font-body);
      }
      .demo-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 1440px;
        margin: 0 auto 20px;
        color: var(--k-text-3);
        font: 400 12px/1.4 var(--k-font-body);
      }
      .demo-bar__spacer { flex: 1; }
      .gallery { display: flex; flex-direction: column; gap: 32px; max-width: 1440px; margin: 0 auto; }
      .gallery__head h1 { margin: 0 0 8px; font: 800 28px/1.15 var(--k-font-display); color: var(--k-text); }
      .gallery__head p { margin: 0; max-width: 70ch; color: var(--k-text-3); }
      .gallery__section h2 { margin: 0 0 12px; font: 800 22px/1.2 var(--k-font-display); color: var(--k-text); }
      .gallery__pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .gallery__col {
        min-width: 0;
        padding: 16px;
        border-radius: var(--k-radius-lg);
        background: var(--k-canvas);
        box-shadow: var(--k-shadow-1);
      }
      .gallery__tag { margin-bottom: 12px; color: var(--k-text-3); font: 600 12px/1 var(--k-font-body); }
      .gallery__stage { display: flex; flex-direction: column; gap: 12px; }
      .gallery__row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .gallery__note { margin: 0; color: var(--k-text-3); font: 400 13px/1.5 var(--k-font-body); }
      .gallery__col .k-split { min-height: 280px; }
      .legacy { max-width: 1440px; margin: 40px auto 0; }
      .legacy h2 { margin: 0 0 8px; font: 800 22px/1.2 var(--k-font-display); }
      .legacy p.hint { margin: 0 0 20px; color: var(--k-text-3); font-size: 13px; }
      .legacy .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 24px; }
      .legacy .row label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
      .legacy .row.ink { padding: 16px; border-radius: 20px; background: #0b0d14; }
      .legacy .row.pills { position: relative; height: 70px; }
      .legacy .row.pills > div { position: absolute; right: 16px; top: 9px; }
      @media (max-width: 900px) {
        .gallery__pair { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <span id="theme-label"></span>
      <button type="button" class="k-btn k-btn--sm" id="theme-light" aria-pressed="false"></button>
      <button type="button" class="k-btn k-btn--sm" id="theme-dark" aria-pressed="false"></button>
      <span class="demo-bar__spacer"></span>
    </div>
    <main id="gallery"></main>
    <section class="legacy">
      <h2>LimitRing</h2>
      <p class="hint">Кольцо лимита бота. Восемь штук для замера нагрузки в покое; ползунок проверяет update().</p>
      <div class="row" id="rings"></div>
      <div class="row">
        <label>Значение первого кольца <input type="range" id="slider" min="0" max="100" value="42" /></label>
      </div>
      <h2>MicButton и StepPill</h2>
      <p class="hint">Кнопка голоса во всех состояниях и плашка шагов дока. В покое анимаций нет.</p>
      <div class="row ink" id="mics"></div>
      <div class="row ink pills" id="pills"></div>
    </section>
    <script src="/i18n.js"></script>
    <script src="/ui/kit.js"></script>
    <script src="/ui-demo.js"></script>
  </body>
</html>
