<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deloist: правка текста</title>
    <link rel="icon" href="data:," />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/kit.css" />
    <link rel="stylesheet" href="/ui/kit.css" />
    <style>
      /* Окно прозрачное: видна только карточка, тень помещается в отступ. */
      html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
      .card {
        position: absolute; inset: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--k-space-3);
        padding: var(--k-space-3) var(--k-space-4); border-radius: var(--k-radius-md); background: var(--k-surface); color: var(--k-text);
        box-shadow: var(--k-shadow-2);
      }
      .head { display: flex; align-items: center; gap: var(--k-space-2); font-size: var(--k-text-sm); color: var(--k-text-3); }
      .head .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row { display: flex; align-items: center; gap: var(--k-space-3); }
      .ask {
        flex: 1; min-width: 0; resize: none; box-sizing: border-box; height: 64px; padding: var(--k-space-2) var(--k-space-3); font: 400 var(--k-text-md) / 1.4 var(--k-font-body);
        border-radius: var(--k-radius-sm); border: 0; box-shadow: inset 0 0 0 1px var(--k-line-strong); background: var(--k-well); color: inherit;
      }
      .ask:focus { outline: none; box-shadow: var(--k-focus); }
      .ask[readonly] { background: var(--k-surface-2); }
      .btns { display: flex; gap: var(--k-space-2); }
      .go:disabled { opacity: 0.4; }
      .status { font-size: var(--k-text-sm); line-height: 1.35; color: var(--k-text-3); min-height: 18px; max-height: 36px; overflow: hidden; }
      .status.error { color: var(--k-danger-text); }
      .actions { display: flex; gap: var(--k-space-2); justify-content: flex-end; }
      body.notice .row { display: none; }
      body.notice .status { font-size: var(--k-text-md); color: var(--k-text); }
    </style>
  </head>
  <body data-voice="manual">
    <div class="card" id="card">
      <div class="head">
        <span class="what" id="what"></span>
        <button type="button" class="close k-btn k-btn--ghost k-btn--icon k-btn--sm" id="close" aria-label="Закрыть">×</button>
      </div>
      <div class="row">
        <textarea class="ask" id="ask" rows="2"></textarea>
        <div class="btns">
          <button type="button" class="mic mic-btn k-btn k-btn--ghost k-btn--icon" id="mic"></button>
          <button type="button" class="go k-btn k-btn--primary k-btn--icon" id="go" disabled aria-label="Переписать">
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="arrow-up"></svg>
          </button>
        </div>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
    <script src="/i18n.js"></script>
    <script src="/ui/kit.js"></script>
    <script src="/voice.js"></script>
    <script src="/snap.js"></script>
  </body>
</html>
